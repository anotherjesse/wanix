name: CI

on:
  pull_request:
  push:

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
