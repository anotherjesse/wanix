[workspace]
members = [
    "crates/wanix-cli",
    "crates/wanix-9p",
    "crates/wanix-fs",
    "crates/wanix-protocol",
    "crates/wanix-qjs",
    "crates/wanix-qjs-engine",
    "crates/wanix-task",
    "crates/wanix-term",
    "crates/wanix-vfs",
    "crates/wanix-wasi",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/tractordev/wanix"
rust-version = "1.93"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
