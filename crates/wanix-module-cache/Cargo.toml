[package]
name = "wanix-module-cache"
description = "Shared owner-private on-disk cache for Wasmtime-compiled modules (qjs + wasm runtimes)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
sha2 = "0.10"
wasmtime = { version = "45.0.0", default-features = false, features = [
    "anyhow",
    "cranelift",
    "runtime",
    "std",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[lib]
name = "wanix_module_cache"
path = "src/lib.rs"
