[package]
name = "wanix-cli"
description = "Native CLI and demos for the Rust-native Wanix port."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
tar = "0.4"
tungstenite = "0.29.0"
wanix-9p = { path = "../wanix-9p" }
wanix-fs = { path = "../wanix-fs" }
wanix-kv = { path = "../wanix-kv" }
wanix-pipe = { path = "../wanix-pipe" }
wanix-protocol = { path = "../wanix-protocol" }
wanix-qjs = { path = "../wanix-qjs" }
wanix-task = { path = "../wanix-task" }
wanix-term = { path = "../wanix-term" }
wanix-vfs = { path = "../wanix-vfs" }
wanix-wasi = { path = "../wanix-wasi" }
wanix-wasm = { path = "../wanix-wasm" }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "wanix-rust"
path = "src/main.rs"

[lints]
workspace = true
