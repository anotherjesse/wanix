[package]
name = "wanix-cli"
description = "Native CLI and demos for the Rust-native Wanix port."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
tungstenite = "0.29.0"
wanix-9p = { path = "../wanix-9p" }
wanix-9p-client = { path = "../wanix-9p-client" }
wanix-agent = { path = "../wanix-agent" }
wanix-appfs = { path = "../wanix-appfs" }
wanix-cas = { path = "../wanix-cas" }
wanix-cpu = { path = "../wanix-cpu" }
wanix-fs = { path = "../wanix-fs" }
wanix-id = { path = "../wanix-id" }
wanix-job = { path = "../wanix-job" }
wanix-jobfs = { path = "../wanix-jobfs" }
wanix-kv = { path = "../wanix-kv" }
wanix-mesh = { path = "../wanix-mesh" }
wanix-pipe = { path = "../wanix-pipe" }
wanix-plumb = { version = "0.1.0", path = "../wanix-plumb" }
wanix-protocol = { path = "../wanix-protocol" }
wanix-qjs = { path = "../wanix-qjs" }
wanix-site-fs = { path = "../wanix-site-fs" }
wanix-sites = { path = "../wanix-sites" }
wanix-task = { path = "../wanix-task" }
wanix-term = { path = "../wanix-term" }
wanix-tool = { path = "../wanix-tool" }
wanix-vfs = { path = "../wanix-vfs" }
wanix-wasi = { path = "../wanix-wasi" }
wanix-wasm = { path = "../wanix-wasm" }

[[bin]]
name = "wanix-rust"
path = "src/main.rs"

[lints]
workspace = true
