[package]
name = "wanix-cli"
description = "Native CLI and demos for the Rust-native Wanix port."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
libc = "0.2"
tungstenite = "0.29.0"
wanix-9p = { path = "../wanix-9p" }
wanix-fs = { path = "../wanix-fs" }
wanix-protocol = { path = "../wanix-protocol" }
wanix-qjs = { path = "../wanix-qjs" }
wanix-task = { path = "../wanix-task" }
wanix-term = { path = "../wanix-term" }
wanix-vfs = { path = "../wanix-vfs" }
wanix-wasi = { path = "../wanix-wasi" }

[[bin]]
name = "wanix-rust"
path = "src/main.rs"

[lints]
workspace = true
