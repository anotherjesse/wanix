# Standalone SSG guest compiled to wasm32-wasip1; its own workspace so the
# parent Wanix workspace never tries to build it for the host target.
#
# Build & vendor (see README.md):
#   rustup target add wasm32-wasip1
#   cd crates/wanix-site-gen/wasm-src
#   cargo build --release --target wasm32-wasip1
#   cp target/wasm32-wasip1/release/ssg.wasm ../fixtures/site-gen.wasm
[package]
name = "ssg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ssg"
path = "src/main.rs"

[dependencies]
wanix-site-gen = { path = ".." }

[profile.release]
opt-level = "s"
strip = true

[workspace]
